<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20F5E6"/>
      <stop offset="100%" stop-color="#00B8D9"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B8C7D9"/>
      <stop offset="100%" stop-color="#6D7C91"/>
    </linearGradient>

    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101C2B"/>
      <stop offset="100%" stop-color="#050A11"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="shieldClip">
      <path d="M400 55 L690 155 L650 510 Q620 650 400 745 Q180 650 150 510 L110 155 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="#050A11"/>

  <!-- Outer Shield -->
  <path
    d="M400 40
       L705 145
       L662 515
       Q625 670 400 765
       Q175 670 138 515
       L95 145 Z"
    fill="#07111D"
    stroke="#182A3C"
    stroke-width="12"
  />

  <!-- Teal Shield Border -->
  <path
    d="M400 60
       L680 157
       L642 505
       Q608 635 400 725
       Q192 635 158 505
       L120 157 Z"
    fill="none"
    stroke="url(#teal)"
    stroke-width="5"
    opacity="0.9"
  />

  <!-- Silver Inner Border -->
  <path
    d="M400 78
       L655 166
       L620 493
       Q585 615 400 695
       Q215 615 180 493
       L145 166 Z"
    fill="none"
    stroke="url(#silver)"
    stroke-width="5"
    opacity="0.8"
  />

  <!-- Circuit Pattern -->
  <g clip-path="url(#shieldClip)"
     fill="none"
     stroke="url(#teal)"
     stroke-width="4"
     opacity="0.55">

    <path d="M190 510 V590 H260 V650"/>
    <path d="M230 490 V560 H300 V635"/>
    <path d="M270 500 V585 H330 V670"/>
    <path d="M610 510 V590 H540 V650"/>
    <path d="M570 490 V560 H500 V635"/>
    <path d="M530 500 V585 H470 V670"/>

    <path d="M350 500 V680"/>
    <path d="M400 500 V705"/>
    <path d="M450 500 V680"/>

    <circle cx="260" cy="590" r="6" fill="#20F5E6"/>
    <circle cx="300" cy="560" r="6" fill="#20F5E6"/>
    <circle cx="330" cy="585" r="6" fill="#20F5E6"/>

    <circle cx="540" cy="590" r="6" fill="#20F5E6"/>
    <circle cx="500" cy="560" r="6" fill="#20F5E6"/>
    <circle cx="470" cy="585" r="6" fill="#20F5E6"/>

    <circle cx="400" cy="650" r="7" fill="#20F5E6"/>
  </g>

  <!-- Abstract Network Nodes -->
  <g fill="url(#teal)" filter="url(#smallGlow)">
    <circle cx="235" cy="230" r="9"/>
    <circle cx="565" cy="230" r="9"/>
    <circle cx="205" cy="285" r="6"/>
    <circle cx="595" cy="285" r="6"/>
  </g>

  <!-- Network Lines -->
  <g stroke="#20F5E6" stroke-width="4" fill="none" opacity="0.8">
    <path d="M235 230 L285 270"/>
    <path d="M565 230 L515 270"/>
    <path d="M205 285 L260 305"/>
    <path d="M595 285 L540 305"/>
  </g>

  <!-- AI Eye Outer -->
  <path
    d="M175 350
       Q400 185 625 350
       Q400 515 175 350 Z"
    fill="url(#dark)"
    stroke="url(#silver)"
    stroke-width="8"
  />

  <!-- Eye Teal Interior -->
  <path
    d="M205 350
       Q400 220 595 350
       Q400 480 205 350 Z"
    fill="#071722"
    stroke="url(#teal)"
    stroke-width="5"
  />

  <!-- Eye Iris -->
  <circle
    cx="400"
    cy="350"
    r="92"
    fill="#07121D"
    stroke="url(#silver)"
    stroke-width="7"
  />

  <!-- Iris Rings -->
  <circle
    cx="400"
    cy="350"
    r="73"
    fill="none"
    stroke="#00D9CC"
    stroke-width="10"
    stroke-dasharray="25 12"
    filter="url(#smallGlow)"
  />

  <circle
    cx="400"
    cy="350"
    r="49"
    fill="url(#teal)"
    opacity="0.9"
  />

  <circle
    cx="400"
    cy="350"
    r="35"
    fill="#06111B"
  />

  <!-- Eye Highlight -->
  <circle cx="418" cy="332" r="13" fill="white"/>

  <!-- Left AI Circuit -->
  <g stroke="url(#silver)" stroke-width="5" fill="none">
    <path d="M310 315 H270 V295 H235"/>
    <path d="M310 350 H250 V350 H215"/>
    <path d="M310 385 H270 V405 H235"/>
  </g>

  <g fill="#20F5E6">
    <circle cx="235" cy="295" r="7"/>
    <circle cx="215" cy="350" r="7"/>
    <circle cx="235" cy="405" r="7"/>
  </g>

  <!-- Right AI Circuit -->
  <g stroke="url(#silver)" stroke-width="5" fill="none">
    <path d="M490 315 H530 V295 H565"/>
    <path d="M490 350 H550 V350 H585"/>
    <path d="M490 385 H530 V405 H565"/>
  </g>

  <g fill="#20F5E6">
    <circle cx="565" cy="295" r="7"/>
    <circle cx="585" cy="350" r="7"/>
    <circle cx="565" cy="405" r="7"/>
  </g>

  <!-- Orbit -->
  <path
    d="M205 350 Q400 145 595 350"
    fill="none"
    stroke="#20F5E6"
    stroke-width="5"
    opacity="0.7"
  />

  <path
    d="M205 350 Q400 555 595 350"
    fill="none"
    stroke="#20F5E6"
    stroke-width="3"
    opacity="0.35"
  />

  <!-- Signal Waves -->
  <g
    fill="none"
    stroke="#20F5E6"
    stroke-width="6"
    stroke-linecap="round"
  >
    <path d="M275 190 Q295 165 320 155"/>
    <path d="M265 165 Q295 130 330 120"/>
    <path d="M525 190 Q505 165 480 155"/>
    <path d="M535 165 Q505 130 470 120"/>
  </g>

  <!-- Central Vertical Data Lines -->
  <g stroke="#20F5E6" stroke-width="5" opacity="0.7">
    <path d="M370 470 V545"/>
    <path d="M400 475 V575"/>
    <path d="M430 470 V545"/>
  </g>

  <!-- Logo Name Plate -->
  <path
    d="M105 445
       L695 445
       L670 565
       Q400 610 130 565 Z"
    fill="url(#dark)"
    stroke="#1C3448"
    stroke-width="5"
  />

  <!-- Name Plate Accent -->
  <path
    d="M125 458
       Q400 490 675 458"
    fill="none"
    stroke="url(#teal)"
    stroke-width="4"
  />

  <!-- Brand Name -->
  <text
    x="400"
    y="530"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="800"
    letter-spacing="-2"
    fill="white"
  >
    Sentinel<tspan fill="#20F5E6">-Hub</tspan>
  </text>

  <!-- Bottom Accent -->
  <path
    d="M220 580 Q400 605 580 580"
    fill="none"
    stroke="#20F5E6"
    stroke-width="3"
    opacity="0.8"
  />

  <!-- Small Tagline -->
  <text
    x="400"
    y="625"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="600"
    letter-spacing="5"
    fill="#91A4B8"
  >
    AGENTIC EXECUTION ECONOMY
  </text>

  <!-- Decorative Stars -->
  <g fill="white" opacity="0.85">
    <path d="M185 190 l4 10 l10 4 l-10 4 l-4 10 l-4-10 l-10-4 l10-4z"/>
    <path d="M615 190 l4 10 l10 4 l-10 4 l-4 10 l-4-10 l-10-4 l10-4z"/>
    <circle cx="315" cy="205" r="3"/>
    <circle cx="485" cy="205" r="3"/>
  </g>
</svg>